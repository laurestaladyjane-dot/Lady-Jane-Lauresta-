<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Google Drive Video Website</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #111;
        }

        p {
            color: #666;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        /* Responsive wrapper to keep the 16:9 aspect ratio scaling nicely on phones and PCs */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 0;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #5E453D;
            border-radius: 8px;
            overflow: hidden;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My Video Page</h1>
        <p>This video is hosted securely on Google Drive and embedded directly into this GitHub Pages site</p>
        <p>This is me Lady Jane Lauresta who loves to learn new things,improve my skills and gain more knowledge</p>
        
        <div class="video-wrapper">
            <!-- Google Drive Embedded Player -->
            <iframe src="https://drive.google.com/file/d/1ihPBdVO_cRcQLUDvep8XJiG5c2Qj6JVE/preview" allow="autoplay" allowfullscreen></iframe>
        </div>
    </div>

</body>
</html>
